# West manifest: `west init -l firmware && west update` fetches Zephyr 4.2
# and only the modules this firmware needs.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.2.0
      import:
        name-allowlist: [cmsis, cmsis_6, hal_nordic, mbedtls, segger, picolibc]
  self:
    path: firmware
