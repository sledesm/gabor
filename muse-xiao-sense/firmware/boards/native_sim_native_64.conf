# native_sim: the end-to-end test against local fakes (tests/test_e2e_sim.py).
# Same TLS path as the hardware, with a test CA, and the same heap budget as
# the XIAO (64-bit pointers make this the harder case).
CONFIG_MUSE_HEAP_SIZE=102400
CONFIG_HEAP_MEM_POOL_SIZE=10240
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_DNS_RESOLVER=n
CONFIG_MUSE_SETUP_OVER_TCP=y
CONFIG_MUSE_ROOT_CA_FILE="tests/certs/test_ca.der"
CONFIG_MUSE_API_BASE="https://localhost:18443"
CONFIG_MUSE_NOISE_HOST="localhost:18444"
CONFIG_MUSE_SDK_TOKEN="mgst_test_only"
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
