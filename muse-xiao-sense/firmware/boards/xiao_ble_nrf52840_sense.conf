# Seeed XIAO nRF52840 Sense

# Memory: cJSON, mbedTLS and the Noise session share the gadget's own heap
# (CONFIG_MUSE_HEAP_SIZE); the kernel heap serves Zephyr internals such as
# WebSocket send buffers, and libc malloc has no users.
CONFIG_MUSE_HEAP_SIZE=102400
CONFIG_HEAP_MEM_POOL_SIZE=10240
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048

# Bluetooth LE setup (the Muse app pairs over GATT)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MuseGadget"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_RX_STACK_SIZE=2048

# Wi-Fi through an ESP-AT module on the XIAO's UART (D6 TX, D7 RX)
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
CONFIG_WIFI_ESP_AT_DNS_USE=y
CONFIG_WIFI_ESP_AT_MDM_RX_BUF_COUNT=24
CONFIG_WIFI_ESP_AT_MDM_RING_BUF_SIZE=2048
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=n
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_NET_UDP=y

# Sensors
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_I2C=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_REGULATOR=y
CONFIG_NET_MAX_CONN=4
